      observacion: ""
      correccion: ""
    accion: Vender 16 × CREMA en caja (o conteo autorizado a 4)
    verificar_ui: CEN-CREMA pasa a Bajo mínimo
    verificar_bd: |-
      SELECT i.sede_nombre, pr.nombre AS producto, i.existencia, i.minimo, i.maximo, i.estado, i.existencia_negativa, i.valor
