id: "ESC-CAJA-62"
nombre: "Folios: formato por sede, consecutivos y sin reutilización"
version: 1
fuente: "REGLAS_NEGOCIO.md P-133 ({SEDE}-TKT-{NNNNNN}; nunca se reutilizan ni reinician), P-129"
