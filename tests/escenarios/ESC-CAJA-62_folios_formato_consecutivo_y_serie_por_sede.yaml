pasos:
  - n: 1
    descripcion: "Cobrar dos tickets seguidos en Centenario"
    esperado: "Folios CEN-TKT-N y CEN-TKT-N+1"
    legado:
      resultado: "sin corrida previa"
      observacion: ""
      correccion: ""
    accion: "Cobrar CREMA-A dos veces; notas QA-{corrida}-ESC-CAJA-62 y -B"
    verificar_ui: "Folios consecutivos"
    verificar_bd: "SELECT v.folio FROM piefirme.ventas v WHERE v.nota LIKE 'QA-{corrida}-ESC-CAJA-62%' ORDER BY v.created_at;"
    esperado_bd:
      formato: "^CEN-TKT-[0-9]{6}$"
      segundo: "primero + 1"
    precondicion_critica: true
  - n: 2
    descripcion: "Cobrar un ticket en Patio"
    esperado: "Folio con serie propia de la sede: PAT-TKT-NNNNNN"
    legado:
      resultado: "sin corrida previa"
      observacion: ""
      correccion: ""
    accion: "Login usuario de Patio y cobrar; nota QA-{corrida}-ESC-CAJA-62-P"
    verificar_ui: "Prefijo PAT"
    verificar_bd: "SELECT v.folio, s.clave FROM piefirme.ventas v JOIN piefirme.sedes s ON s.id = v.sede_id WHERE v.nota LIKE 'QA-{corrida}-ESC-CAJA-62-P%';"
    esperado_bd:
      formato: "^PAT-TKT-[0-9]{6}$"
    ambiguo: "A34"
  - n: 3
    descripcion: "Cancelar el último ticket de Centenario y cobrar otro"
    esperado: "El nuevo folio es N+2: no reutiliza el cancelado"
    legado:
      resultado: "sin corrida previa"
      observacion: ""
      correccion: ""
    accion: "Cancelar y cobrar"
    verificar_ui: "Folio nuevo"
    verificar_bd: "SELECT v.folio, v.estado FROM piefirme.ventas v WHERE v.nota LIKE 'QA-{corrida}-ESC-CAJA-62%' AND v.folio LIKE 'CEN-%' ORDER BY v.created_at;"
    esperado_bd:
      folios_unicos: true
      tercer_folio: "primero + 2"
