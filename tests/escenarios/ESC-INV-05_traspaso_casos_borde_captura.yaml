# ESC-INV-05 · generado por qa-arquitecto (docs/METODOLOGIA_QA.md §4 Fase 1, §5, §13)
# El esperado sale de los documentos de negocio (reglas citadas), no del código.
# Prefijo de datos de la corrida: QA-{corrida}-. Pasos marcados «ambiguo» NO se juzgan hasta que negocio responda (registrar VERIFICAR).
id: ESC-INV-05
nombre: "Traspaso: cantidad 0, negativa, mayor a la existencia, mismo origen y destino, producto inexistente"
version: 1
fuente: REGLAS_NEGOCIO.md P-080, P-085 (existencia negativa solo en ventas); CLAUDE.md (traspasos solo por RPC); MATRIZ_ROLES §4.3
prioridad: alta
rol: recepcion
ambiguo:
