  - id: A-INV-10
    pregunta: "Cantidades decimales en traspasos (la columna admite 3 decimales; el catálogo no dice qué productos se fraccionan) y partidas repetidas del mismo producto: ¿qué se espera?"
reglas:
  - P-080
  - P-085
  - P-079
precondiciones:
  - Ambiente QA (nunca producción); BD restaurada de tests/datos/semilla.sql; cuentas de prueba según docs/ACCESOS.md (r@g.com recepción, m@g.com administrador, p@g.com podólogo; a@g.com superadministrador)
  - "Dos sedes de la misma clínica: Centenario (origen) y Patio Valle de Chalco (destino). Reglas de alcance (sede) según MATRIZ_ROLES §4.3; usuarios de recepción asignados a una sola sede cada uno (ver ambiguo A-INV-12)"
  - "Catálogo: QA-{corrida}-CREMA (venta, costo_promedio 100.00, sin lote); producto inexistente: SKU QA-{corrida}-NOEXISTE no está en el catálogo"
  - Existencia Centenario CREMA 20; Patio Valle de Chalco CREMA 2; r@g.com de Centenario
datos_creados:
  prefijo_qa: QA-{corrida}-ESC-INV-05
  nota_en_registros: QA-{corrida}-ESC-INV-05  (se captura en comentarios del traspaso / nota del movimiento / motivo de la merma)
  casos:
    - cantidad 0
    - cantidad −3
    - cantidad 25 > existencia 20
    - cantidad 2.5 (decimal)
    - origen = destino
    - sin partidas
    - producto inexistente
    - CREMA repetida dos veces en el mismo traspaso
pasos:
  - "n": 1
    descripcion: Capturar una partida con cantidad 0
    esperado: "Se rechaza: la cantidad debe ser mayor a 0; no se crea la partida"
    legado:
      resultado: sin corrida previa
      observacion: ""
      correccion: ""
    accion: Nuevo traspaso → CREMA cantidad 0 → Guardar
    verificar_ui: Mensaje de validación en la cantidad
    verificar_bd: SELECT count(*) AS traspasos_nuevos FROM piefirme.traspasos t WHERE t.comentarios LIKE 'QA-{corrida}-ESC-INV-05%';
    esperado_bd:
      traspasos_nuevos: 0
    precondicion_critica: true
  - "n": 2
    descripcion: Capturar cantidad negativa (−3)
    esperado: Se rechaza; no se crea nada
    legado:
      resultado: sin corrida previa
      observacion: ""
      correccion: ""
    accion: CREMA cantidad −3 → Guardar
    verificar_ui: Mensaje de validación
    verificar_bd: SELECT count(*) AS lineas FROM piefirme.traspaso_lineas l JOIN piefirme.traspasos t ON t.id = l.traspaso_id WHERE t.comentarios LIKE 'QA-{corrida}-ESC-INV-05%';
    esperado_bd:
      lineas: 0
  - "n": 3
    descripcion: Capturar cantidad mayor a la existencia en origen (25 con existencia 20)
    esperado: "Esperado propuesto: aviso visible de existencia insuficiente en origen y el envío no deja existencia negativa en el origen (a diferencia de la venta, P-085, el traspaso no es una venta al cliente)"
    legado:
      resultado: sin corrida previa
      observacion: ""
      correccion: ""
    accion: CREMA cantidad 25 → Guardar borrador → intentar Enviar
    verificar_ui: Aviso de insuficiencia; envío bloqueado
    verificar_bd: |-
      SELECT i.sede_nombre, pr.nombre AS producto, i.existencia, i.minimo, i.maximo, i.estado, i.existencia_negativa, i.valor
