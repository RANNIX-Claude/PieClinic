# ESC-CAJA-37 · generado por qa-arquitecto (docs/METODOLOGIA_QA.md §4 Fase 1, §5, §13)
# El esperado sale de los documentos de negocio (reglas citadas), no del código.
# Prefijo de datos de la corrida: QA-{corrida}-. Pasos marcados «ambiguo» NO se juzgan hasta que negocio responda (registrar VERIFICAR).
id: "ESC-CAJA-37"
nombre: "Cantidad enorme (999,999) y letras"
version: 1
fuente: "REGLAS_NEGOCIO.md P-057, P-085; caso borde de caja (negocio no define tope)"
prioridad: "baja"
rol: "recepcion"
reglas:
  - "P-057"
  - "P-085"
precondiciones:
  - "Ambiente QA (nunca producción); BD restaurada de tests/datos/semilla.sql; cuentas de prueba según docs/ACCESOS.md (r@g.com recepción, s@g.com supervisor, m@g.com administrador, p@g.com podólogo)"
  - "Turno abierto: Caja 1, sede Centenario, cajero r@g.com, fondo inicial 1000.00, nombre_turno 'QA-{corrida}-ESC-CAJA-37'"
  - "Catálogo QA de la corrida cargado con precios de lista de datos_creados (productos y servicios con prefijo QA-{corrida}-)"
datos_creados:
  prefijo_qa: "QA-{corrida}-ESC-CAJA-37"
  nota_en_tickets: "QA-{corrida}-ESC-CAJA-37  (se captura en la nota del ticket y/o turno; ver A33)"
  catalogo:
    crema_a:
      tipo: "producto"
      nombre: "QA-{corrida}-CREMA-A"
      precio_lista_iva_incluido: 116
      iva: "16 %"
      existencia_centenario: 20
      nota: "base 100.00 + IVA 16.00"
ambiguo:
  - id: "A05"
    pregunta: "Cantidad máxima por línea y monto máximo por ticket (no hay tope definido por negocio)."
pasos:
  - n: 1
    descripcion: "CREMA-A con cantidad 999999"
    esperado: "Total exacto 115,999,884.00 (116 × 1,000,000 − 116); sin error de servidor, sin notación científica ni pérdida de decimales; aviso por falta de existencia (P-085)"
    legado:
      resultado: "sin corrida previa"
      observacion: ""
      correccion: ""
    accion: "Teclear 999999; nota QA-{corrida}-ESC-CAJA-37"
    verificar_ui: "Total 115,999,884.00 o mensaje de tope"
    verificar_bd: |
      SELECT l.orden, l.tipo, l.descripcion, l.cantidad, l.precio_unitario, l.descuento, l.importe, l.iva_tipo, l.base_neta, l.iva_monto, l.atendio_id
      FROM piefirme.venta_lineas l JOIN piefirme.ventas v ON v.id = l.venta_id
      WHERE v.nota LIKE 'QA-{corrida}-ESC-CAJA-37%'
      ORDER BY v.created_at, l.orden;
    esperado_bd:
      si_se_permite:
        importe: 115999884
        base_neta: 99999900
        iva_monto: 15999984
    precondicion_critica: true
    ambiguo: "A05"
  - n: 2
    descripcion: "Cantidad con 20 dígitos"
    esperado: "Se rechaza con mensaje; no se cae la pantalla ni la consola reporta error no controlado"
    legado:
      resultado: "sin corrida previa"
      observacion: ""
      correccion: ""
    accion: "Teclear 99999999999999999999"
    verificar_ui: "Mensaje de valor inválido"
    verificar_bd: |
      SELECT l.orden, l.tipo, l.descripcion, l.cantidad, l.precio_unitario, l.descuento, l.importe, l.iva_tipo, l.base_neta, l.iva_monto, l.atendio_id
      FROM piefirme.venta_lineas l JOIN piefirme.ventas v ON v.id = l.venta_id
      WHERE v.nota LIKE 'QA-{corrida}-ESC-CAJA-37%'
      ORDER BY v.created_at, l.orden;
    esperado_bd:
      cantidad: "sin valor corrupto"
    ambiguo: "A05"
  - n: 3
    descripcion: "No cobrar: cancelar el ticket de prueba"
    esperado: "Queda cancelado con motivo; sin dinero registrado"
    legado:
      resultado: "sin corrida previa"
      observacion: ""
      correccion: ""
    accion: "Cancelar con motivo «QA basura»"
    verificar_ui: "Cancelado"
    verificar_bd: |
      SELECT v.folio, v.estado, v.subtotal, v.descuento_total, v.iva_total, v.total, v.anticipo_aplicado, v.pagado_total, v.saldo, v.requiere_factura, v.copias_impresas, v.cancelada_por, v.motivo_cancelacion
      FROM piefirme.ventas v
      WHERE v.nota LIKE 'QA-{corrida}-ESC-CAJA-37%'
      ORDER BY v.created_at;
    esperado_bd:
      estado: "cancelada"
      pagado_total: 0
