id: "ESC-CAJA-32"
nombre: "Redondeo: total del ticket = suma de líneas = CFDI"
version: 1
fuente: "REGLAS_NEGOCIO.md P-057; METRICAS.md M-045"
prioridad: "alta"
rol: "recepcion"
