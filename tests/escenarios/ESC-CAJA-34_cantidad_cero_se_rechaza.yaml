# ESC-CAJA-34 · generado por qa-arquitecto (docs/METODOLOGIA_QA.md §4 Fase 1, §5, §13)
# El esperado sale de los documentos de negocio (reglas citadas), no del código.
# Prefijo de datos de la corrida: QA-{corrida}-. Pasos marcados «ambiguo» NO se juzgan hasta que negocio responda (registrar VERIFICAR).
id: "ESC-CAJA-34"
nombre: "Cantidad 0 en una línea"
version: 1
fuente: "REGLAS_NEGOCIO.md P-057 (cálculo por línea; una línea sin cantidad no genera importe); criterio de caso borde de caja"
prioridad: "media"
rol: "recepcion"
reglas:
  - "P-057"
precondiciones:
  - "Ambiente QA (nunca producción); BD restaurada de tests/datos/semilla.sql; cuentas de prueba según docs/ACCESOS.md (r@g.com recepción, s@g.com supervisor, m@g.com administrador, p@g.com podólogo)"
  - "Turno abierto: Caja 1, sede Centenario, cajero r@g.com, fondo inicial 1000.00, nombre_turno 'QA-{corrida}-ESC-CAJA-34'"
  - "Catálogo QA de la corrida cargado con precios de lista de datos_creados (productos y servicios con prefijo QA-{corrida}-)"
datos_creados:
  prefijo_qa: "QA-{corrida}-ESC-CAJA-34"
  nota_en_tickets: "QA-{corrida}-ESC-CAJA-34  (se captura en la nota del ticket y/o turno; ver A33)"
  catalogo:
    crema_a:
      tipo: "producto"
      nombre: "QA-{corrida}-CREMA-A"
      precio_lista_iva_incluido: 116
      iva: "16 %"
      existencia_centenario: 20
      nota: "base 100.00 + IVA 16.00"
pasos:
  - n: 1
    descripcion: "Agregar CREMA-A y cambiar la cantidad a 0"
    esperado: "No se acepta: la cantidad debe ser mayor que cero; el total no cambia"
    legado:
      resultado: "sin corrida previa"
      observacion: ""
      correccion: ""
    accion: "Teclear 0 en cantidad; nota QA-{corrida}-ESC-CAJA-34"
    verificar_ui: "Mensaje de cantidad inválida; la línea conserva su cantidad anterior o se elimina"
    verificar_bd: |
      SELECT l.orden, l.tipo, l.descripcion, l.cantidad, l.precio_unitario, l.descuento, l.importe, l.iva_tipo, l.base_neta, l.iva_monto, l.atendio_id
      FROM piefirme.venta_lineas l JOIN piefirme.ventas v ON v.id = l.venta_id
      WHERE v.nota LIKE 'QA-{corrida}-ESC-CAJA-34%'
      ORDER BY v.created_at, l.orden;
    esperado_bd:
      cantidad: "mayor que 0 o sin línea"
    precondicion_critica: true
  - n: 2
    descripcion: "Intentar cobrar con cantidad 0"
    esperado: "No se puede cobrar un ticket vacío ni con importe 0 por error"
    legado:
      resultado: "sin corrida previa"
      observacion: ""
      correccion: ""
    accion: "Pulsar Cobrar"
    verificar_ui: "Botón deshabilitado o mensaje"
    verificar_bd: |
      SELECT v.folio, v.estado, v.subtotal, v.descuento_total, v.iva_total, v.total, v.anticipo_aplicado, v.pagado_total, v.saldo, v.requiere_factura, v.copias_impresas, v.cancelada_por, v.motivo_cancelacion
      FROM piefirme.ventas v
      WHERE v.nota LIKE 'QA-{corrida}-ESC-CAJA-34%'
      ORDER BY v.created_at;
    esperado_bd:
      estado: "por_cobrar"
      pagado_total: 0
