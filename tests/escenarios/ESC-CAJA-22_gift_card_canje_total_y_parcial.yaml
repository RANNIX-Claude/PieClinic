      observacion: ""
      correccion: ""
    accion: "Método gift card, código GC500, monto 500; nota QA-{corrida}-ESC-CAJA-22"
    verificar_ui: "Saldo del ticket 132.00"
    verificar_bd: |
      SELECT v.folio, p.metodo, p.monto, p.referencia, p.ultimos4, p.efectivo_recibido, p.cambio
