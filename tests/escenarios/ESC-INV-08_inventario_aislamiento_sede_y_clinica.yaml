id: ESC-INV-08
nombre: Aislamiento de inventario y traspasos entre sedes y entre clínicas; recepción por alguien de otra sede
version: 1
fuente: REQUERIMIENTO.md «QUÉ NO PUEDE FALLAR» (1); REGLAS_NEGOCIO.md P-128, P-129, P-080; MATRIZ_ROLES §3 y §4.3 (alcance origen y destino)
