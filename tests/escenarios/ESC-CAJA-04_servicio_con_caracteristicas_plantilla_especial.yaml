  nota_en_tickets: "QA-{corrida}-ESC-CAJA-04  (se captura en la nota del ticket y/o turno; ver A33)"
  catalogo:
    plantilla:
      tipo: "servicio"
      nombre: "QA-{corrida}-PLANTILLA-ESPECIAL"
      precio_base: 1500
      iva: "exento"
      admite_caracteristicas:
