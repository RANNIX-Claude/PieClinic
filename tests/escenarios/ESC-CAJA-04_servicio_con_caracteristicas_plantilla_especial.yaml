nombre: "Servicio con características (Plantilla ortopédica especial: molde de yeso + mayor altura 3 mm)"
version: 1
fuente: "tests/escenarios/CAJA_escenarios.md (ESC-CAJA-04); REGLAS_NEGOCIO.md P-056, P-067, P-087; docs/CARGA_CATALOGO_PIECLINIC.md"
