# ESC-CAJA-51 · generado por qa-arquitecto (docs/METODOLOGIA_QA.md §4 Fase 1, §5, §13)
# El esperado sale de los documentos de negocio (reglas citadas), no del código.
# Prefijo de datos de la corrida: QA-{corrida}-. Pasos marcados «ambiguo» NO se juzgan hasta que negocio responda (registrar VERIFICAR).
id: "ESC-CAJA-51"
nombre: "Corte de caja con datos conocidos: efectivo esperado calculado a mano"
version: 1
fuente: "REGLAS_NEGOCIO.md P-059; METRICAS.md M-042 (esperado = fondo + efectivo − retiros)"
prioridad: "alta"
rol: "recepcion"
reglas:
