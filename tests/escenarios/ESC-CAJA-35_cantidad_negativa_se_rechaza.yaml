# ESC-CAJA-35 · generado por qa-arquitecto (docs/METODOLOGIA_QA.md §4 Fase 1, §5, §13)
# El esperado sale de los documentos de negocio (reglas citadas), no del código.
# Prefijo de datos de la corrida: QA-{corrida}-. Pasos marcados «ambiguo» NO se juzgan hasta que negocio responda (registrar VERIFICAR).
id: "ESC-CAJA-35"
nombre: "Cantidad negativa en una línea"
version: 1
fuente: "REGLAS_NEGOCIO.md P-057, P-065 (las devoluciones solo van por nota de crédito, no por cantidades negativas)"
prioridad: "media"
rol: "recepcion"
reglas:
  - "P-057"
  - "P-065"
precondiciones:
  - "Ambiente QA (nunca producción); BD restaurada de tests/datos/semilla.sql; cuentas de prueba según docs/ACCESOS.md (r@g.com recepción, s@g.com supervisor, m@g.com administrador, p@g.com podólogo)"
  - "Turno abierto: Caja 1, sede Centenario, cajero r@g.com, fondo inicial 1000.00, nombre_turno 'QA-{corrida}-ESC-CAJA-35'"
  - "Catálogo QA de la corrida cargado con precios de lista de datos_creados (productos y servicios con prefijo QA-{corrida}-)"
datos_creados:
  prefijo_qa: "QA-{corrida}-ESC-CAJA-35"
  nota_en_tickets: "QA-{corrida}-ESC-CAJA-35  (se captura en la nota del ticket y/o turno; ver A33)"
  catalogo:
    crema_a:
      tipo: "producto"
      nombre: "QA-{corrida}-CREMA-A"
      precio_lista_iva_incluido: 116
      iva: "16 %"
      existencia_centenario: 20
      nota: "base 100.00 + IVA 16.00"
pasos:
  - n: 1
    descripcion: "Agregar CREMA-A y teclear cantidad −1"
    esperado: "No se acepta; no se puede usar para restar importe"
    legado:
      resultado: "sin corrida previa"
      observacion: ""
      correccion: ""
    accion: "Teclear -1; nota QA-{corrida}-ESC-CAJA-35"
    verificar_ui: "Mensaje de cantidad inválida"
    verificar_bd: |
      SELECT l.orden, l.tipo, l.descripcion, l.cantidad, l.precio_unitario, l.descuento, l.importe, l.iva_tipo, l.base_neta, l.iva_monto, l.atendio_id
      FROM piefirme.venta_lineas l JOIN piefirme.ventas v ON v.id = l.venta_id
      WHERE v.nota LIKE 'QA-{corrida}-ESC-CAJA-35%'
      ORDER BY v.created_at, l.orden;
    esperado_bd:
      cantidad: "mayor que 0 o sin línea"
    precondicion_critica: true
  - n: 2
    descripcion: "Teclear texto no numérico («abc») y símbolos en cantidad"
    esperado: "No se acepta"
    legado:
      resultado: "sin corrida previa"
      observacion: ""
      correccion: ""
    accion: "Teclear abc y 1e3"
    verificar_ui: "Campo no acepta o marca error"
    verificar_bd: |
      SELECT l.orden, l.tipo, l.descripcion, l.cantidad, l.precio_unitario, l.descuento, l.importe, l.iva_tipo, l.base_neta, l.iva_monto, l.atendio_id
      FROM piefirme.venta_lineas l JOIN piefirme.ventas v ON v.id = l.venta_id
      WHERE v.nota LIKE 'QA-{corrida}-ESC-CAJA-35%'
      ORDER BY v.created_at, l.orden;
    esperado_bd:
      cantidad: "mayor que 0 o sin línea"
  - n: 3
    descripcion: "Verificar que no hubo movimiento de inventario"
    esperado: "Sin movimiento positivo por un ticket sin cobrar"
    legado:
      resultado: "sin corrida previa"
      observacion: ""
      correccion: ""
    accion: "Consultar kardex"
    verificar_ui: "Sin cambios"
    verificar_bd: |
      SELECT m.tipo, m.cantidad, m.referencia_tipo, m.referencia_folio, m.fecha
      FROM piefirme.movimientos_inventario m JOIN piefirme.productos pr ON pr.id = m.producto_id
      WHERE pr.nombre = 'QA-{corrida}-CREMA-A'
      ORDER BY m.created_at;
    esperado_bd:
      movimientos_con_referencia_a_este_ticket: 0
