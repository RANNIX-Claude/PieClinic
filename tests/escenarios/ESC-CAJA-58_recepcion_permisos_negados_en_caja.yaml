version: 1
fuente: "MATRIZ_ROLES.md §4.2 y §4.4; REGLAS_NEGOCIO.md P-130 (Recepción sin finanzas consolidadas, nómina ni comisiones ajenas), P-055, P-058, P-060, P-063, P-065; Autoridad (resumen)"
