pasos:
  - n: 1
    descripcion: "Descuento de 11 % sin PIN de Administrador"
    esperado: "Rechazado: pide PIN"
    legado:
      resultado: "sin corrida previa"
      observacion: ""
      correccion: ""
    accion: "Aplicar 11 %"
    verificar_ui: "Ventana de PIN"
    verificar_bd: |
      SELECT v.folio, v.estado, v.subtotal, v.descuento_total, v.iva_total, v.total, v.anticipo_aplicado, v.pagado_total, v.saldo, v.requiere_factura, v.copias_impresas, v.cancelada_por, v.motivo_cancelacion
      FROM piefirme.ventas v
      WHERE v.nota LIKE 'QA-{corrida}-ESC-CAJA-58%'
      ORDER BY v.created_at;
    esperado_bd:
      descuento_total: 0
    precondicion_critica: true
  - n: 2
    descripcion: "Cancelar un ticket de turno cerrado"
    esperado: "Rechazado: solo Administración"
    legado:
      resultado: "sin corrida previa"
      observacion: ""
      correccion: ""
    accion: "Intentar cancelar"
    verificar_ui: "Sin acción o mensaje"
    verificar_bd: |
      SELECT v.folio, v.estado, v.subtotal, v.descuento_total, v.iva_total, v.total, v.anticipo_aplicado, v.pagado_total, v.saldo, v.requiere_factura, v.copias_impresas, v.cancelada_por, v.motivo_cancelacion
      FROM piefirme.ventas v
      WHERE v.nota LIKE 'QA-{corrida}-ESC-CAJA-58%'
      ORDER BY v.created_at;
    esperado_bd:
      estado: "cobrada"
  - n: 3
    descripcion: "Cancelar un CFDI y emitir una nota de crédito"
    esperado: "Rechazado: solo Administración"
    legado:
      resultado: "sin corrida previa"
      observacion: ""
      correccion: ""
    accion: "Buscar Cancelar CFDI y Nota de crédito"
    verificar_ui: "Sin acción"
    verificar_bd: "SELECT count(*) AS notas FROM piefirme.notas_credito n JOIN piefirme.ventas v ON v.id = n.venta_id WHERE v.nota LIKE 'QA-{corrida}-ESC-CAJA-58%';"
    esperado_bd:
      notas: 0
  - n: 4
    descripcion: "Marcar un turno cerrado como revisado"
    esperado: "Rechazado"
    legado:
      resultado: "sin corrida previa"
      observacion: ""
      correccion: ""
    accion: "Buscar Revisar"
    verificar_ui: "Sin acción"
    verificar_bd: |
      SELECT t.caja, t.estado, t.fondo_inicial, t.efectivo_esperado, t.efectivo_contado, t.diferencia, t.justificacion, t.autorizacion_id, t.cerrado_por, t.revisado_por
