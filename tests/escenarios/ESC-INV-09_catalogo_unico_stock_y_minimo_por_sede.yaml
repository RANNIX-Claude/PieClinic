pasos:
  - "n": 1
    descripcion: Confirmar que el producto CREMA es uno solo en el catálogo y tiene una fila de existencia por sede
    esperado: Un solo producto; una existencia por sede; el total de la clínica es la suma (22)
    legado:
      resultado: sin corrida previa
      observacion: ""
      correccion: ""
    accion: Catálogo → buscar CREMA; Inventario → ¿Qué producto hay en cada tienda?
    verificar_ui: Una sola ficha de producto; desglose por sede y total 22
    verificar_bd: |-
      SELECT count(*) AS productos FROM piefirme.productos WHERE nombre = 'QA-{corrida}-CREMA';
      SELECT i.sede_nombre, pr.nombre AS producto, i.existencia, i.minimo, i.maximo, i.estado, i.existencia_negativa, i.valor
      FROM piefirme.prp_inventario i
      JOIN piefirme.productos pr ON pr.id = i.producto_id
      WHERE pr.nombre LIKE 'QA-{corrida}-%'
      ORDER BY pr.nombre, i.sede_nombre;
