# ESC-CAJA-64 · generado por qa-arquitecto (docs/METODOLOGIA_QA.md §4 Fase 1, §5, §13)
# El esperado sale de los documentos de negocio (reglas citadas), no del código.
# Prefijo de datos de la corrida: QA-{corrida}-. Pasos marcados «ambiguo» NO se juzgan hasta que negocio responda (registrar VERIFICAR).
id: "ESC-CAJA-64"
nombre: "Un ticket cobrado no se edita: se cancela o se acredita"
version: 1
fuente: "REGLAS_NEGOCIO.md §3 Historia (se congela lo emitido), P-060, P-065"
prioridad: "alta"
rol: "recepcion"
reglas:
  - "P-060"
  - "P-057"
  - "P-099"
precondiciones:
  - "Ambiente QA (nunca producción); BD restaurada de tests/datos/semilla.sql; cuentas de prueba según docs/ACCESOS.md (r@g.com recepción, s@g.com supervisor, m@g.com administrador, p@g.com podólogo)"
  - "Turno abierto: Caja 1, sede Centenario, cajero r@g.com, fondo inicial 1000.00, nombre_turno 'QA-{corrida}-ESC-CAJA-64'"
  - "Catálogo QA de la corrida cargado con precios de lista de datos_creados (productos y servicios con prefijo QA-{corrida}-)"
  - "Ticket QA cobrado de 232.00"
datos_creados:
  prefijo_qa: "QA-{corrida}-ESC-CAJA-64"
  nota_en_tickets: "QA-{corrida}-ESC-CAJA-64  (se captura en la nota del ticket y/o turno; ver A33)"
  catalogo:
    crema_a:
      tipo: "producto"
      nombre: "QA-{corrida}-CREMA-A"
      precio_lista_iva_incluido: 116
      iva: "16 %"
      existencia_centenario: 20
      nota: "base 100.00 + IVA 16.00"
pasos:
  - n: 1
    descripcion: "Abrir el ticket cobrado e intentar cambiar la cantidad, quitar una línea o agregar una"
    esperado: "No hay edición: la única vía es cancelar (P-060) o devolución (P-065)"
    legado:
      resultado: "sin corrida previa"
      observacion: ""
      correccion: ""
    accion: "Abrir detalle; nota QA-{corrida}-ESC-CAJA-64"
    verificar_ui: "Campos de solo lectura"
    verificar_bd: |
      SELECT l.orden, l.tipo, l.descripcion, l.cantidad, l.precio_unitario, l.descuento, l.importe, l.iva_tipo, l.base_neta, l.iva_monto, l.atendio_id
      FROM piefirme.venta_lineas l JOIN piefirme.ventas v ON v.id = l.venta_id
      WHERE v.nota LIKE 'QA-{corrida}-ESC-CAJA-64%'
      ORDER BY v.created_at, l.orden;
    esperado_bd:
      cantidad: 2
      importe: 232
    precondicion_critica: true
  - n: 2
    descripcion: "Intentar cambiar el paciente, la sede o el cajero del ticket cobrado"
    esperado: "No se permite"
    legado:
      resultado: "sin corrida previa"
      observacion: ""
      correccion: ""
    accion: "Buscar edición"
    verificar_ui: "Solo lectura"
    verificar_bd: |
      SELECT v.folio, v.estado, v.subtotal, v.descuento_total, v.iva_total, v.total, v.anticipo_aplicado, v.pagado_total, v.saldo, v.requiere_factura, v.copias_impresas, v.cancelada_por, v.motivo_cancelacion
      FROM piefirme.ventas v
      WHERE v.nota LIKE 'QA-{corrida}-ESC-CAJA-64%'
      ORDER BY v.created_at;
    esperado_bd:
      total: 232
      estado: "cobrada"
  - n: 3
    descripcion: "Intentar agregar o quitar un pago del ticket cobrado"
    esperado: "No se permite"
    legado:
      resultado: "sin corrida previa"
      observacion: ""
      correccion: ""
    accion: "Buscar edición de pagos"
    verificar_ui: "Solo lectura"
    verificar_bd: |
      SELECT v.folio, p.metodo, p.monto, p.referencia, p.ultimos4, p.efectivo_recibido, p.cambio
      FROM piefirme.pagos p JOIN piefirme.ventas v ON v.id = p.venta_id
      WHERE v.nota LIKE 'QA-{corrida}-ESC-CAJA-64%'
      ORDER BY v.created_at, p.created_at;
    esperado_bd:
      numero_de_filas: 1
      monto: 232
