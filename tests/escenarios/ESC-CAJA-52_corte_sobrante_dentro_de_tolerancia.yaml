id: "ESC-CAJA-52"
nombre: "Corte con sobrante dentro de la tolerancia de $50.00"
version: 1
fuente: "REGLAS_NEGOCIO.md P-058 (hasta $50.00 lo justifica el cajero)"
prioridad: "alta"
