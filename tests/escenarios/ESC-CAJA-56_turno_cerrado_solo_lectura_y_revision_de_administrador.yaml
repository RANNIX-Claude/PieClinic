pasos:
  - n: 1
    descripcion: "Como r@g.com intentar agregar un pago o retiro al turno cerrado"
    esperado: "Rechazado: turno cerrado"
    legado:
      resultado: "sin corrida previa"
      observacion: ""
      correccion: ""
    accion: "Abrir el turno cerrado → Registrar retiro"
    verificar_ui: "Sin acción disponible"
    verificar_bd: |
      SELECT m.tipo, m.monto, m.concepto, m.autorizacion_id
      FROM piefirme.movimientos_caja m JOIN piefirme.turnos_caja t ON t.id = m.turno_id
      WHERE t.nombre_turno LIKE 'QA-{corrida}-ESC-CAJA-56%'
      ORDER BY m.created_at;
    esperado_bd:
      numero_de_filas_nuevas: 0
    precondicion_critica: true
  - n: 2
    descripcion: "Como r@g.com intentar reabrir o cerrar de nuevo"
    esperado: "No se puede"
    legado:
      resultado: "sin corrida previa"
      observacion: ""
      correccion: ""
    accion: "Buscar Reabrir / Cerrar"
    verificar_ui: "Sin acción"
    verificar_bd: |
      SELECT t.caja, t.estado, t.fondo_inicial, t.efectivo_esperado, t.efectivo_contado, t.diferencia, t.justificacion, t.autorizacion_id, t.cerrado_por, t.revisado_por
      FROM piefirme.turnos_caja t
      WHERE t.nombre_turno LIKE 'QA-{corrida}-ESC-CAJA-56%'
      ORDER BY t.apertura_en;
    esperado_bd:
      estado: "cerrado"
  - n: 3
    descripcion: "Como r@g.com intentar marcar el turno como revisado"
    esperado: "No puede: la revisión es de Administración"
    legado:
      resultado: "sin corrida previa"
      observacion: ""
      correccion: ""
    accion: "Buscar Revisar"
    verificar_ui: "Sin acción"
    verificar_bd: |
      SELECT t.caja, t.estado, t.fondo_inicial, t.efectivo_esperado, t.efectivo_contado, t.diferencia, t.justificacion, t.autorizacion_id, t.cerrado_por, t.revisado_por
      FROM piefirme.turnos_caja t
      WHERE t.nombre_turno LIKE 'QA-{corrida}-ESC-CAJA-56%'
