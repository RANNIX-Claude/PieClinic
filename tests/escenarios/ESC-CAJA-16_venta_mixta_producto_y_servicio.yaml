# ESC-CAJA-16 · generado por qa-arquitecto (docs/METODOLOGIA_QA.md §4 Fase 1, §5, §13)
# El esperado sale de los documentos de negocio (reglas citadas), no del código.
# Prefijo de datos de la corrida: QA-{corrida}-. Pasos marcados «ambiguo» NO se juzgan hasta que negocio responda (registrar VERIFICAR).
id: "ESC-CAJA-16"
nombre: "Venta mixta: producto con IVA y servicio exento en el mismo ticket"
version: 1
fuente: "REGLAS_NEGOCIO.md P-056, P-057; METRICAS.md M-040, M-041"
prioridad: "alta"
rol: "recepcion"
reglas:
  - "P-056"
  - "P-057"
  - "P-078"
precondiciones:
  - "Ambiente QA (nunca producción); BD restaurada de tests/datos/semilla.sql; cuentas de prueba según docs/ACCESOS.md (r@g.com recepción, s@g.com supervisor, m@g.com administrador, p@g.com podólogo)"
  - "Turno abierto: Caja 1, sede Centenario, cajero r@g.com, fondo inicial 1000.00, nombre_turno 'QA-{corrida}-ESC-CAJA-16'"
  - "Catálogo QA de la corrida cargado con precios de lista de datos_creados (productos y servicios con prefijo QA-{corrida}-)"
datos_creados:
  prefijo_qa: "QA-{corrida}-ESC-CAJA-16"
  nota_en_tickets: "QA-{corrida}-ESC-CAJA-16  (se captura en la nota del ticket y/o turno; ver A33)"
  catalogo:
    crema_a:
      tipo: "producto"
      nombre: "QA-{corrida}-CREMA-A"
      precio_lista_iva_incluido: 116
      iva: "16 %"
      existencia_centenario: 20
      nota: "base 100.00 + IVA 16.00"
    quiro:
      tipo: "servicio"
      nombre: "QA-{corrida}-QUIROPODIA"
      precio_fijo_iva_incluido: 400
      iva: "exento"
pasos:
  - n: 1
    descripcion: "Agregar 2 × CREMA-A y 1 × QUIROPODIA"
    esperado: "Total 632.00; IVA incluido solo del producto: 32.00; base de producto 200.00 y servicio 400.00"
    legado:
      resultado: "sin corrida previa"
      observacion: ""
      correccion: ""
    accion: "Nueva venta con ambas líneas; nota QA-{corrida}-ESC-CAJA-16"
    verificar_ui: "Subtotal 632.00, IVA 32.00, total 632.00"
    verificar_bd: |
      SELECT l.orden, l.tipo, l.descripcion, l.cantidad, l.precio_unitario, l.descuento, l.importe, l.iva_tipo, l.base_neta, l.iva_monto, l.atendio_id
      FROM piefirme.venta_lineas l JOIN piefirme.ventas v ON v.id = l.venta_id
      WHERE v.nota LIKE 'QA-{corrida}-ESC-CAJA-16%'
      ORDER BY v.created_at, l.orden;
    esperado_bd:
      numero_de_filas: 2
      suma_importe: 632
      suma_iva_monto: 32
    precondicion_critica: true
  - n: 2
    descripcion: "Cobrar en efectivo 632.00 exactos"
    esperado: "Cambio 0.00; cobrado"
    legado:
      resultado: "sin corrida previa"
      observacion: ""
      correccion: ""
    accion: "Efectivo 632"
    verificar_ui: "Sin cambio"
    verificar_bd: |
      SELECT v.folio, v.estado, v.subtotal, v.descuento_total, v.iva_total, v.total, v.anticipo_aplicado, v.pagado_total, v.saldo, v.requiere_factura, v.copias_impresas, v.cancelada_por, v.motivo_cancelacion
      FROM piefirme.ventas v
      WHERE v.nota LIKE 'QA-{corrida}-ESC-CAJA-16%'
      ORDER BY v.created_at;
    esperado_bd:
      estado: "cobrada"
      total: 632
      iva_total: 32
      pagado_total: 632
      saldo: 0
  - n: 3
    descripcion: "Verificar que cada línea registra quién atendió o vendió"
    esperado: "Cada línea lleva atendió/vendió para comisión (P-078)"
    legado:
      resultado: "sin corrida previa"
      observacion: ""
      correccion: ""
    accion: "Abrir detalle del ticket"
    verificar_ui: "Columna atendió visible"
    verificar_bd: |
      SELECT l.orden, l.tipo, l.descripcion, l.cantidad, l.precio_unitario, l.descuento, l.importe, l.iva_tipo, l.base_neta, l.iva_monto, l.atendio_id
      FROM piefirme.venta_lineas l JOIN piefirme.ventas v ON v.id = l.venta_id
      WHERE v.nota LIKE 'QA-{corrida}-ESC-CAJA-16%'
      ORDER BY v.created_at, l.orden;
    esperado_bd:
      atendio_id: "no nulo en las dos líneas"
