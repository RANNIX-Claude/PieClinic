id: "ESC-CAJA-05"
nombre: "Cobro con PIN personal"
version: 1
fuente: "tests/escenarios/CAJA_escenarios.md (ESC-CAJA-05); REGLAS_NEGOCIO.md P-078"
prioridad: "media"
rol: "recepcion"
reglas:
