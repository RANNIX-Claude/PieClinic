ambiguo:
  - id: "A17"
    pregunta: "Cancelación de ticket de turno cerrado (P-060 + P-099): ¿cómo se refleja si el corte ya está cerrado? Se asume ajuste en el turno/periodo siguiente con referencia; ¿sale el dinero como devolución o retiro?"
pasos:
  - n: 1
    descripcion: "Como r@g.com buscar el ticket del turno cerrado e intentar cancelarlo"
    esperado: "Recepción no puede: no hay acción o es rechazada"
    legado:
      resultado: "sin corrida previa"
      observacion: ""
      correccion: ""
    accion: "Ventas → ticket → Cancelar venta"
    verificar_ui: "Acción ausente o mensaje de que solo Administración puede"
    verificar_bd: |
      SELECT v.folio, v.estado, v.subtotal, v.descuento_total, v.iva_total, v.total, v.anticipo_aplicado, v.pagado_total, v.saldo, v.requiere_factura, v.copias_impresas, v.cancelada_por, v.motivo_cancelacion
      FROM piefirme.ventas v
      WHERE v.nota LIKE 'QA-{corrida}-ESC-CAJA-43%'
      ORDER BY v.created_at;
    esperado_bd:
      estado: "cobrada"
    precondicion_critica: true
  - n: 2
    descripcion: "Como m@g.com cancelarlo sin motivo"
    esperado: "Exige motivo"
    legado:
      resultado: "sin corrida previa"
      observacion: ""
      correccion: ""
    accion: "Cancelar con motivo vacío"
    verificar_ui: "Mensaje de motivo requerido"
    verificar_bd: |
      SELECT v.folio, v.estado, v.subtotal, v.descuento_total, v.iva_total, v.total, v.anticipo_aplicado, v.pagado_total, v.saldo, v.requiere_factura, v.copias_impresas, v.cancelada_por, v.motivo_cancelacion
      FROM piefirme.ventas v
      WHERE v.nota LIKE 'QA-{corrida}-ESC-CAJA-43%'
      ORDER BY v.created_at;
    esperado_bd:
      estado: "cobrada"
  - n: 3
    descripcion: "Cancelar con motivo «QA-{corrida}-ESC-CAJA-43 ajuste autorizado»"
    esperado: "Se cancela; no se borra; se registra quién y por qué"
    legado:
      resultado: "sin corrida previa"
      observacion: ""
      correccion: ""
    accion: "Cancelar con motivo"
    verificar_ui: "Estado Cancelada"
    verificar_bd: |
      SELECT v.folio, v.estado, v.subtotal, v.descuento_total, v.iva_total, v.total, v.anticipo_aplicado, v.pagado_total, v.saldo, v.requiere_factura, v.copias_impresas, v.cancelada_por, v.motivo_cancelacion
      FROM piefirme.ventas v
      WHERE v.nota LIKE 'QA-{corrida}-ESC-CAJA-43%'
      ORDER BY v.created_at;
    esperado_bd:
      estado: "cancelada"
      cancelada_por: "id de m@g.com"
    ambiguo: "A17"
  - n: 4
    descripcion: "Verificar que el corte cerrado no cambió y el ajuste va al periodo siguiente"
    esperado: "El corte del turno cerrado queda de solo lectura (P-099); el ajuste se refleja con referencia en el periodo siguiente"
    legado:
      resultado: "sin corrida previa"
      observacion: ""
      correccion: ""
    accion: "Consultar corte del turno T0 y el turno actual"
    verificar_ui: "Corte T0 sin modificaciones"
    verificar_bd: |
      SELECT c.ventas_total, c.cobros_total, c.ventas_efectivo, c.ventas_tarjeta, c.ventas_transferencia, c.ventas_clip, c.ventas_gift_card, c.anticipos_aplicados, c.cortesias, c.retiros, c.cancelaciones_efectivo, c.cancelaciones_total, c.numero_cancelaciones, c.fondo_inicial, c.efectivo_esperado, c.efectivo_contado, c.diferencia, c.justificacion, c.autorizacion_id
      FROM piefirme.cortes_caja c JOIN piefirme.turnos_caja t ON t.id = c.turno_id
      WHERE t.nombre_turno LIKE 'QA-{corrida}-ESC-CAJA-43%';
    esperado_bd:
      corte_T0: "sin cambios"
      ajuste: "en periodo siguiente con referencia"
    ambiguo: "A17"
