# ESC-INV-04 · generado por qa-arquitecto (docs/METODOLOGIA_QA.md §4 Fase 1, §5, §13)
# El esperado sale de los documentos de negocio (reglas citadas), no del código.
# Prefijo de datos de la corrida: QA-{corrida}-. Pasos marcados «ambiguo» NO se juzgan hasta que negocio responda (registrar VERIFICAR).
id: ESC-INV-04
nombre: "Cancelar un traspaso: en borrador no mueve inventario; enviado solo Administración"
version: 1
fuente: REGLAS_NEGOCIO.md P-080 (estado Cancelado); MODELO_ESTADOS.md S28 y D-72; esquema C_resumen D-72
prioridad: alta
rol: recepcion_y_administrador
ambiguo:
  - id: A-INV-08
    pregunta: "D-72 sigue abierta en MODELO_ESTADOS: ¿se puede cancelar un traspaso ya Enviado, quién (solo Administración?) y la mercancía en tránsito regresa al origen? El esperado de estos pasos es la propuesta del esquema; negocio debe confirmarla o cambiarla."
reglas:
  - P-080
precondiciones:
  - Ambiente QA (nunca producción); BD restaurada de tests/datos/semilla.sql; cuentas de prueba según docs/ACCESOS.md (r@g.com recepción, m@g.com administrador, p@g.com podólogo; a@g.com superadministrador)
  - "Dos sedes de la misma clínica: Centenario (origen) y Patio Valle de Chalco (destino). Reglas de alcance (sede) según MATRIZ_ROLES §4.3; usuarios de recepción asignados a una sola sede cada uno (ver ambiguo A-INV-12)"
  - "Catálogo: QA-{corrida}-CREMA (venta, costo_promedio 100.00, sin lote)"
  - "Existencia: Centenario CREMA 20; Patio Valle de Chalco CREMA 2. Dos traspasos: uno en Borrador y otro ya Enviado (10 × CREMA, Centenario: 10 tras el envío)"
datos_creados:
  prefijo_qa: QA-{corrida}-ESC-INV-04
  nota_en_registros: QA-{corrida}-ESC-INV-04  (se captura en comentarios del traspaso / nota del movimiento / motivo de la merma)
  traspaso_borrador: QA-{corrida}-ESC-INV-04-A (5 × CREMA)
  traspaso_enviado: QA-{corrida}-ESC-INV-04-B (10 × CREMA)
pasos:
  - "n": 1
    descripcion: Cancelar el traspaso en Borrador (ESC-INV-04-A) con motivo
    esperado: Estado Cancelado; sin ningún movimiento de inventario; el folio no se reutiliza ni se borra; el motivo queda guardado
    legado:
      resultado: sin corrida previa
      observacion: ""
      correccion: ""
    accion: Abrir el borrador → Cancelar → motivo «QA solicitado por error»
    verificar_ui: Estado Cancelado; no editable
    verificar_bd: |-
      SELECT t.folio, t.estado, t.cancelado_motivo FROM piefirme.traspasos t WHERE t.comentarios LIKE 'QA-{corrida}-ESC-INV-04-A%';
      SELECT count(*) AS movs FROM piefirme.movimientos_inventario m WHERE m.referencia_folio IN (SELECT folio FROM piefirme.traspasos WHERE comentarios LIKE 'QA-{corrida}-ESC-INV-04-A%');
    esperado_bd:
      estado: cancelado
      movs: 0
      cancelado_motivo: no vacío
    precondicion_critica: true
  - "n": 2
    descripcion: Verificar que un traspaso cancelado no puede enviarse ni recibirse
    esperado: Sin botón Enviar ni Recibir; si se fuerza por llamada directa, se rechaza
    legado:
      resultado: sin corrida previa
      observacion: ""
      correccion: ""
    accion: Abrir el traspaso cancelado
    verificar_ui: Solo lectura
    verificar_bd: SELECT t.estado FROM piefirme.traspasos t WHERE t.comentarios LIKE 'QA-{corrida}-ESC-INV-04-A%';
    esperado_bd:
      estado: cancelado
  - "n": 3
    descripcion: Recepción (r@g.com) intenta cancelar el traspaso ya Enviado (04-B)
    esperado: "La regla no lo define para recepción; el esquema lo reserva a Administración (propuesto). Esperado propuesto: recepción no puede cancelar un traspaso enviado"
    legado:
      resultado: sin corrida previa
      observacion: ""
      correccion: ""
    accion: Sesión de recepción → abrir 04-B → buscar Cancelar
    verificar_ui: Sin opción de cancelar o error de permiso
    verificar_bd: SELECT t.estado FROM piefirme.traspasos t WHERE t.comentarios LIKE 'QA-{corrida}-ESC-INV-04-B%';
    esperado_bd:
      estado: enviado
    ambiguo: A-INV-08
  - "n": 4
    descripcion: Administrador cancela el traspaso Enviado con motivo
    esperado: Estado Cancelado; la mercancía en tránsito regresa al origen (+10) una sola vez; el destino no suma nada; queda motivo, quién y cuándo
    legado:
      resultado: sin corrida previa
      observacion: ""
      correccion: ""
    accion: m@g.com → 04-B → Cancelar traspaso → motivo
    verificar_ui: Cancelado; existencia de Centenario vuelve a 20
    verificar_bd: |-
      SELECT t.estado, t.cancelado_motivo
      FROM piefirme.traspasos t
      WHERE t.comentarios LIKE 'QA-{corrida}-ESC-INV-04-B%';
      SELECT i.sede_nombre, pr.nombre AS producto, i.existencia, i.minimo, i.maximo, i.estado, i.existencia_negativa, i.valor
      FROM piefirme.prp_inventario i
      JOIN piefirme.productos pr ON pr.id = i.producto_id
      WHERE pr.nombre LIKE 'QA-{corrida}-%'
      ORDER BY pr.nombre, i.sede_nombre;
    esperado_bd:
      estado: cancelado
      existencia_centenario_crema: 20
      existencia_pvc_crema: 2
    ambiguo: A-INV-08
  - "n": 5
    descripcion: Verificar kardex de la cancelación y bitácora
    esperado: Un solo movimiento de reversa (+10) en origen referenciado al folio; no hay doble reversa; bitácora con usuario y motivo
    legado:
      resultado: sin corrida previa
      observacion: ""
      correccion: ""
    accion: Kardex y Bitácora
    verificar_ui: Movimiento de reversa visible
    verificar_bd: |-
      SELECT s.nombre AS sede, pr.nombre AS producto, m.tipo, m.cantidad, m.costo_unitario, m.referencia_tipo, m.referencia_folio, m.usuario_id, m.fecha
      FROM piefirme.movimientos_inventario m
      JOIN piefirme.sedes s ON s.id = m.sede_id
      JOIN piefirme.productos pr ON pr.id = m.producto_id
      WHERE pr.nombre LIKE 'QA-{corrida}-%'
        AND (m.nota LIKE 'QA-{corrida}-ESC-INV-04-B%' OR m.referencia_folio IN (SELECT t.folio FROM piefirme.traspasos t WHERE t.comentarios LIKE 'QA-{corrida}-ESC-INV-04-B%'))
      ORDER BY m.created_at, m.id;
      SELECT b.accion, b.entidad, b.entidad_id, b.usuario_id, b.sede_id, b.detalle, b.created_at
      FROM piefirme.bitacora b
      WHERE b.entidad IN ('traspasos') AND b.entidad_id IN (SELECT t.id::text FROM piefirme.traspasos t WHERE t.comentarios LIKE 'QA-{corrida}-ESC-INV-04-B%')
      ORDER BY b.id;
    esperado_bd:
      reversa_origen: 10
      reversas: 1
    ambiguo: A-INV-08
  - "n": 6
    descripcion: Reintentar la cancelación (doble clic / segunda vez) del mismo traspaso
    esperado: La segunda cancelación se rechaza o no hace nada; la existencia no se duplica a 30
    legado:
      resultado: sin corrida previa
      observacion: ""
      correccion: ""
    accion: Volver a pulsar Cancelar / repetir
    verificar_ui: Mensaje de que ya está cancelado
    verificar_bd: |-
      SELECT i.sede_nombre, pr.nombre AS producto, i.existencia, i.minimo, i.maximo, i.estado, i.existencia_negativa, i.valor
      FROM piefirme.prp_inventario i
      JOIN piefirme.productos pr ON pr.id = i.producto_id
      WHERE pr.nombre LIKE 'QA-{corrida}-%'
      ORDER BY pr.nombre, i.sede_nombre;
    esperado_bd:
      existencia_centenario_crema: 20
