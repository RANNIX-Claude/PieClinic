<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clínicas de Podología — Menú de mockups</title>
<style>
:root{--p:#7b5ea7;--pd:#5b3f8c;--pdd:#4c3377;--pl:#efe9f8;--bg:#f4f5f9;--tx:#1f2330;--acc:#f59e0b}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:14px/1.4 Inter,'Segoe UI',system-ui,Arial,sans-serif;background:var(--bg);color:var(--tx);display:flex;flex-direction:column}
header{height:60px;background:var(--p);color:#fff;display:flex;align-items:center;gap:14px;padding:0 18px;flex:none}
.x{background:none;border:0;color:#fff;font-size:20px;cursor:pointer;width:34px;height:34px;border-radius:8px}
.x:hover{background:rgba(255,255,255,.15)}
.logo{width:40px;height:40px;border-radius:10px;background:rgba(255,255,255,.18);display:grid;place-items:center}
.brand b{font-size:17px;letter-spacing:.2px}
.brand small{display:block;font-size:11px;opacity:.85;margin-top:-1px}
.ver{font-size:10px;font-weight:700;background:#fde68a;color:#7a5200;border-radius:5px;padding:2px 6px;margin-left:8px;vertical-align:2px}
.sp{flex:1}
header select{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:8px;padding:7px 10px;font:inherit}
header select option{color:#222}
.bell{width:34px;height:34px;display:grid;place-items:center;border-radius:8px}
.user{background:rgba(255,255,255,.2);border-radius:9px;padding:7px 14px;font-weight:600;display:flex;gap:8px;align-items:center}
.body{flex:1;display:flex;min-height:0}
nav{width:250px;background:var(--pd);color:#e8e0f5;overflow-y:auto;flex:none;padding:6px 0 28px}
nav.off{display:none}
.sec{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:#b9a8d9;padding:18px 20px 6px;border-top:1px solid rgba(255,255,255,.08);margin-top:8px}
.sec:first-child{border-top:0;margin-top:0}
.it{display:flex;align-items:center;gap:12px;padding:10px 20px;margin:2px 10px;border-radius:8px;cursor:pointer;color:#e8e0f5;border-left:3px solid transparent;text-decoration:none}
.it:hover{background:rgba(255,255,255,.08)}
.it.on{background:var(--p);border-left-color:var(--acc);color:#fff;font-weight:600}
.it.dim{opacity:.4;cursor:not-allowed}
.it.dim:hover{background:none}
.it svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.it i{margin-left:auto;font-style:normal;font-size:10px;opacity:.6}
main{flex:1;min-width:0;position:relative}
iframe{border:0;width:100%;height:100%;display:block;background:var(--bg)}
.fab{position:fixed;right:22px;bottom:22px;width:56px;height:56px;border-radius:50%;background:var(--p);color:#fff;border:0;box-shadow:0 6px 18px rgba(91,63,140,.45);cursor:pointer;display:grid;place-items:center;z-index:5}
.chat{position:fixed;right:22px;bottom:90px;width:340px;max-width:calc(100vw - 44px);background:#fff;border-radius:16px;box-shadow:0 12px 40px rgba(0,0,0,.25);overflow:hidden;display:none;z-index:5}
.chat.on{display:block}
.chat h4{margin:0;background:var(--p);color:#fff;padding:14px 16px;font-size:14px}
.chat h4 small{display:block;font-weight:400;opacity:.85;font-size:11px}
.chat p{margin:16px;background:#f1f2f6;border-radius:14px;padding:12px 14px;font-size:13px}
.chat div{border-top:1px solid #e5e7eb;padding:12px 16px;color:#9aa0ad;font-size:13px}
@media(max-width:820px){nav{position:fixed;z-index:4;top:60px;bottom:0;box-shadow:6px 0 20px rgba(0,0,0,.3)}.brand small,.ver{display:none}}
</style>
</head>
<body>
<header>
  <button class="x" id="tg" title="Mostrar / ocultar menú">☰</button>
  <div class="logo"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg></div>
  <div class="brand"><b>Clínicas de Podología<span class="ver">V_261116_E2</span></b><small>Gestión integral · 7 sucursales · mockups para validar con el cliente</small></div>
  <div class="sp"></div>
  <select title="Sucursal"><option>Sucursal Centro</option><option>Sucursal Norte</option><option>Sucursal Sur</option><option>Sucursal Oriente</option><option>Todas (consolidado)</option></select>
  <div class="bell"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"/></svg></div>
  <div class="user">superadmin</div>
</header>
<div class="body">
  <nav id="nav"></nav>
  <main><iframe id="fr" title="Pantalla"></iframe></main>
</div>
<button class="fab" id="fab" title="Agente operativo"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></button>
<div class="chat" id="chat"><h4>Agente Operativo<small>Podología — RANNIX Consulting</small></h4><p>¡Hola! Soy el Agente Operativo. ¿En qué puedo ayudarte con la administración de las clínicas?</p><div>Escribe o pega una imagen…</div></div>

<script>
const I = {
  dash:'<path d="M3 3h7v9H3zM14 3h7v5h-7zM14 12h7v9h-7zM3 16h7v5H3z"/>',
  userplus:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/>',
  cal:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
  act:'<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>',
  flask:'<path d="M10 2v7.5L4 20a1 1 0 0 0 1 1.5h14a1 1 0 0 0 1-1.5l-6-10.5V2M8.5 2h7"/>',
  spark:'<path d="M12 3v4M12 17v4M3 12h4M17 12h4M5.6 5.6l2.8 2.8M15.6 15.6l2.8 2.8M18.4 5.6l-2.8 2.8M8.4 15.6l-2.8 2.8"/>',
  cart:'<circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/>',
  cash:'<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2"/>',
  mark:'<path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>',
  card:'<rect x="1" y="4" width="22" height="16" rx="2"/><path d="M1 10h22"/>',
  doc:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8"/>',
  box:'<path d="M21 16V8a2 2 0 0 0-1-1.7l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.7l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="M3.3 7L12 12l8.7-5M12 22V12"/>',
  rep:'<path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/>',
  clip:'<rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2M9 14l2 2 4-4"/>',
  tag:'<path d="M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0L2 12V2h10l8.6 8.6a2 2 0 0 1 0 2.8z"/><circle cx="7" cy="7" r="1"/>',
  shield:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/>',
  bars:'<path d="M12 20V10M18 20V4M6 20v-4"/>',
  users:'<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/>',
  truck:'<path d="M1 3h15v13H1zM16 8h4l3 3v5h-7"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
  list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>'
};

/* Menú organizado por la naturaleza del proceso (macroprocesos del REQUERIMIENTO).
   f = archivo del mockup; sin f = módulo previsto, todavía sin pantalla. */
const MENU = [
  {t:null, items:[
    {n:'Dashboard', i:'dash', f:'13_gerente_tablero_sucursal'}]},
  {t:'Pacientes', items:[
    {n:'Alta de paciente', i:'userplus', f:'01_recepcion_alta_paciente'},
    {n:'Agenda de citas', i:'cal', f:'02_recepcion_agenda_citas'},
    {n:'Convenios y membresías', i:'users'}]},
  {t:'Atención clínica', items:[
    {n:'Consulta y expediente', i:'act', f:'03_podologo_consulta_expediente'},
    {n:'Plantillas y laboratorio', i:'flask', f:'04_podologo_orden_plantilla'},
    {n:'Esterilización', i:'spark', f:'15_asistente_esterilizacion_ciclo'}]},
  {t:'Ventas y caja', items:[
    {n:'Punto de venta', i:'cart', f:'05_cajero_pos_cobro'},
    {n:'Caja y turnos', i:'cash', f:'06_cajero_apertura_corte_caja'},
    {n:'Apartados', i:'mark', f:'07_cajero_apartado_alta'},
    {n:'Crédito y plazos', i:'card', f:'08_cajero_credito_plan_pagos'},
    {n:'Facturación', i:'doc'}]},
  {t:'Almacén y compras', items:[
    {n:'Recepción de compra', i:'box', f:'09_almacen_recepcion_compra'},
    {n:'Traspasos', i:'rep', f:'10_almacen_traspaso'},
    {n:'Inventario físico', i:'clip', f:'11_almacen_toma_inventario'},
    {n:'Proveedores y pagos', i:'truck'}]},
  {t:'Administración', items:[
    {n:'Precios y parámetros', i:'tag', f:'12_admin_precios_parametros'},
    {n:'Autorización', i:'shield', f:'14_gerente_autorizaciones'},
    {n:'Recursos humanos', i:'users'},
    {n:'Usuarios y roles', i:'gear'}]},
  {t:'Análisis', items:[
    {n:'Reportes', i:'bars'},
    {n:'Bitácora', i:'list'}]}
];

const nav = document.getElementById('nav'), fr = document.getElementById('fr');
let html = '';
MENU.forEach(s => {
  if (s.t) html += `<div class="sec">${s.t}</div>`;
  s.items.forEach(m => {
    const svg = `<svg viewBox="0 0 24 24">${I[m.i]}</svg>`;
    html += m.f
      ? `<a class="it" data-f="${m.f}" href="#${m.f}">${svg}<span>${m.n}</span><i>${m.f.slice(0,2)}</i></a>`
      : `<div class="it dim" title="Módulo previsto en el requerimiento, sin mockup todavía">${svg}<span>${m.n}</span></div>`;
  });
});
nav.innerHTML = html;

function go(f){
  if(!f) f = '13_gerente_tablero_sucursal';
  fr.src = f + '.html';
  nav.querySelectorAll('.it').forEach(a => a.classList.toggle('on', a.dataset.f === f));
  document.title = 'Podología — ' + (nav.querySelector('.it.on span')||{}).textContent;
  if (innerWidth <= 820) nav.classList.add('off');
}
nav.addEventListener('click', e => { const a = e.target.closest('a.it'); if(a){ e.preventDefault(); history.replaceState(null,'','#'+a.dataset.f); go(a.dataset.f);} });
document.getElementById('tg').onclick = () => nav.classList.toggle('off');
document.getElementById('fab').onclick = () => document.getElementById('chat').classList.toggle('on');
if (innerWidth <= 820) nav.classList.add('off');
addEventListener('hashchange', () => go(location.hash.slice(1)));
go(location.hash.slice(1));
</script>
</body>
</html>
